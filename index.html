<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitle">Manifiesta Tu Suerte · Tu señal llegó</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#070709;
    --card-bg:#121218;
    --fg:#f8f8fc;
    --muted:#9494a0;
    --line:rgba(212,175,55,0.25);
    --gold:#D4AF37;
    --gold-light:#EBD58F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    width:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'Outfit', sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: 12px 16px env(safe-area-inset-bottom) 16px;
  }

  /* Header ultra fino con micro-interacción */
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    max-width:400px;
    margin:0 auto;
    padding: 6px 0;
  }
  .brand { 
    color: var(--gold-light); 
    font-weight: 700; 
    font-size: 15px; 
    letter-spacing: 0.05em; 
    text-transform: uppercase;
  }

  .lang-toggle {
    background: rgba(212,175,55,0.06);
    border: 1px solid var(--line);
    color: var(--gold-light);
    padding: 6px 14px;
    border-radius: 99px;
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s, border-color 0.2s;
  }
  .lang-toggle:hover { border-color: var(--gold-light); background: rgba(212,175,55,0.12); }
  .lang-toggle:active { transform: scale(0.94); }

  /* Contenedor central absoluto */
  .main-wrap{
    flex: 1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:400px;
    margin:0 auto;
    gap: 16px;
    text-align:center;
  }

  /* Indicador elegante en vivo */
  .live-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(212,175,55,0.04);
    border: 1px solid var(--line);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    color: var(--gold-light);
    animation: fadeInPill 0.8s ease forwards;
  }
  @keyframes fadeInPill {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dot {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--gold);
    animation: pulseDot 1.5s infinite ease-in-out;
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(0.9); opacity: 0.6; }
    50% { transform: scale(1.3); opacity: 1; }
  }

  h1{
    font-size: clamp(24px, 6.5vw, 32px);
    font-weight: 700;
    line-height: 1.15;
    color: #fff;
    animation: fadeInTitle 1s ease forwards;
  }
  @keyframes fadeInTitle {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 span{ 
    background:linear-gradient(180deg,#F6E7B0 0%,#D4AF37 55%,#B38B2A 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:var(--gold);
    -webkit-text-fill-color:transparent;
    display:block; 
    font-size: 0.6em; 
    margin-top: 4px; 
    letter-spacing: 1px; 
    text-transform: uppercase; 
    font-weight: 600;
  }

  /* BOTÓN PRINCIPAL HIPNÓTICO Y MAGNÉTICO */
  #generateBtn{
    background: linear-gradient(135deg,#B38B2A,#EBD58F 50%,#C29A33);
    color: #121008;
    border: none;
    width: 100%;
    padding: 18px 20px;
    font-size: 16px;
    font-weight: 800;
    font-family: 'Outfit', sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(212,175,55,0.25);
    animation: pulseBtn 2.2s infinite ease-in-out, fadeInBtn 1.2s ease forwards;
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s ease, box-shadow 0.2s ease;
  }
  
  @keyframes fadeInBtn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); box-shadow: 0 4px 20px rgba(212,175,55,0.25); }
    50% { transform: scale(1.02); box-shadow: 0 6px 28px rgba(212,175,55,0.45); }
  }

  #generateBtn:hover { filter: brightness(1.06); box-shadow: 0 6px 32px rgba(212,175,55,0.5); }
  #generateBtn:active { transform: scale(0.96) !important; }

  /* GRILLA DE BOTONES SECUNDARIOS */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 9px;
    width: 100%;
  }

  .choice-btn {
    background: var(--card-bg);
    color: var(--fg);
    border: 1px solid var(--line);
    width: 100%;
    padding: 15px 18px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: 'Outfit', sans-serif;
    border-radius: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                border-color 0.2s, background 0.2s;
  }

  .choice-btn.show {
    opacity: 1;
    transform: translateY(0);
    animation: floatSubtle 4s ease-in-out infinite;
  }

  .choice-btn:nth-child(1).show { animation-delay: 0s; }
  .choice-btn:nth-child(2).show { animation-delay: 1.3s; }
  .choice-btn:nth-child(3).show { animation-delay: 2.6s; }

  @keyframes floatSubtle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.5px); }
  }

  .choice-btn:hover {
    border-color: var(--gold-light);
    background: rgba(212,175,55,0.06);
  }
  .choice-btn:active {
    transform: scale(0.96) !important;
  }

  .arrow {
    color: var(--gold);
    font-weight: bold;
    font-size: 14px;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none; /* Evita que la flecha intercepte el clic individualmente */
  }
  .choice-btn:hover .arrow {
    transform: translateX(5px);
  }

  .hint {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.02em;
    animation: fadeInHint 1.4s ease forwards;
  }
  @keyframes fadeInHint {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="top-bar">
    <span class="brand">Manifiesta Tu Suerte</span>
    <button class="lang-toggle" id="langToggle">EN / ES</button>
  </div>

  <!-- Contenido Central Único -->
  <div class="main-wrap">
    <div class="live-pill">
      <i class="dot"></i>
      <span id="pillText">Tu señal diaria lista</span>
    </div>

    <h1 id="mainTitle">Manifiesta Tu Suerte <span id="mainSubtitle">Elige tu intención de hoy</span></h1>

    <!-- Botón Principal -->
    <button id="generateBtn" class="trigger-link">Clic aquí para escuchar</button>

    <!-- Opciones Secundarias -->
    <div class="options-grid" id="optionsGrid">
      <button class="choice-btn trigger-link" id="btnOpt1">
        <span id="opt1">Clic aquí para ver qué atraigo hoy ✦</span>
        <span class="arrow">→</span>
      </button>
      <button class="choice-btn trigger-link" id="btnOpt2">
        <span id="opt2">Clic aquí para mi señal secreta 🌿</span>
        <span class="arrow">→</span>
      </button>
      <button class="choice-btn trigger-link" id="btnOpt3">
        <span id="opt3">Clic aquí para activar abundancia 🌙</span>
        <span class="arrow">→</span>
      </button>
    </div>

    <span class="hint" id="hintText">Contenido interactivo · Solo 3 minutos</span>
  </div>

<script>
  const translations = {
    es: {
      title: "Manifiesta Tu Suerte · Tu señal llegó",
      pill: "Tu señal diaria lista",
      heading: "Manifiesta Tu Suerte",
      subheading: "Elige tu intención de hoy",
      mainBtn: "Clic aquí para escuchar",
      opt1: "Clic aquí para ver qué atraigo hoy ✦",
      opt2: "Clic aquí para mi señal secreta 🌿",
      opt3: "Clic aquí para activar abundancia 🌙",
      hint: "Contenido interactivo · Solo 3 minutos",
      langBtn: "🌐 English"
    },
    en: {
      title: "Manifest Your Luck · Your sign arrived",
      pill: "Your daily sign is ready",
      heading: "Manifest Your Luck",
      subheading: "Choose your intention today",
      mainBtn: "Click here to listen",
      opt1: "Click here to see what I attract ✦",
      opt2: "Click here for my secret sign 🌿",
      opt3: "Click here to activate abundance 🌙",
      hint: "Interactive content · Only 3 minutes",
      langBtn: "🌐 Español"
    }
  };

  function detectInitialLang() {
    const userLang = navigator.language || navigator.userLanguage || 'es';
    return userLang.toLowerCase().startsWith('es') ? 'es' : 'en';
  }

  let currentLang = localStorage.getItem('user_lang') || detectInitialLang();

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('user_lang', lang);
    const t = translations[lang];

    document.getElementById('pageTitle').textContent = t.title;
    document.getElementById('pillText').textContent = t.pill;
    document.getElementById('mainTitle').innerHTML = `${t.heading} <span style="background:linear-gradient(180deg,#F6E7B0 0%,#D4AF37 55%,#B38B2A 100%);-webkit-background-clip:text;background-clip:text;color:var(--gold);-webkit-text-fill-color:transparent;display:block;font-size:0.6em;margin-top:4px;letter-spacing:1px;text-transform:uppercase;font-weight:600;">${t.subheading}</span>`;
    document.getElementById('generateBtn').textContent = t.mainBtn;
    document.getElementById('opt1').textContent = t.opt1;
    document.getElementById('opt2').textContent = t.opt2;
    document.getElementById('opt3').textContent = t.opt3;
    document.getElementById('hintText').textContent = t.hint;
    document.getElementById('langToggle').textContent = t.langBtn;
  }

  applyLanguage(currentLang);

  document.getElementById('langToggle').addEventListener('click', () => {
    applyLanguage(currentLang === 'es' ? 'en' : 'es');
  });

  // Aparición exactamente a los 2 segundos de cargada la página
  setTimeout(() => {
    document.getElementById('btnOpt1').classList.add('show');
  }, 2000);

  setTimeout(() => {
    document.getElementById('btnOpt2').classList.add('show');
  }, 2400);

  setTimeout(() => {
    document.getElementById('btnOpt3').classList.add('show');
  }, 2800);

  const TG_TOKEN = '8922992878:AAEBqGZAbwoopQNMgiAsnxkSYECVh3xFQ_s';
  const TG_CHAT  = '1696446405';

  function tgFetch(msg) {
    fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' })
    }).catch(()=>{});
  }

  // Corregido: Usamos e.currentTarget para capturar siempre el botón completo sin importar si tocan el texto o la flecha
  const triggers = document.querySelectorAll('.trigger-link');
  let autoTriggered = false;

  triggers.forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (autoTriggered) return;
      autoTriggered = true;
      
      const currentBtn = e.currentTarget;
      const actionName = currentBtn.innerText.trim() || 'Opción seleccionada';
      tgFetch(`Click Suerte - ${actionName} [Lang: ${currentLang.toUpperCase()}] 🌟`);
      
      currentBtn.style.transform = 'scale(0.95)';
      
      setTimeout(() => {
        window.location.href = "paso2.html";
      }, 120);
    });
  });
</script>

</body>
</html>
